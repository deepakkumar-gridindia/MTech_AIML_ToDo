<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0f0f1a">
<title>Deepak Kumar · BITS AI ML</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;--surface:#16162a;--surface2:#1e1e35;--surface3:#252545;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);
  --text:#f0eeff;--text2:#a09bbf;--text3:#6b6688;
  --r-sm:6px;--r-md:10px;--r-lg:14px;
  --aci-h:#a78bfa;--aci-bg:rgba(124,58,237,0.12);--aci-br:rgba(167,139,250,0.3);
  --drl-h:#34d399;--drl-bg:rgba(5,150,105,0.12);--drl-br:rgba(52,211,153,0.3);
  --nlp-h:#60a5fa;--nlp-bg:rgba(37,99,235,0.12);--nlp-br:rgba(96,165,250,0.3);
  --seml-h:#fbbf24;--seml-bg:rgba(217,119,6,0.12);--seml-br:rgba(251,191,36,0.3);
  --todo-h:#f472b6;--todo-bg:rgba(236,72,153,0.12);--todo-br:rgba(244,114,182,0.3);
}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── LOGIN PAGE ── */
#login-page{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1a0533 0%,#0d1b4a 40%,#0a2e1a 100%)}
#login-page::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,0.3) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(37,99,235,0.25) 0%,transparent 50%),
             radial-gradient(ellipse at 60% 90%,rgba(5,150,105,0.2) 0%,transparent 50%)}
.login-box{position:relative;z-index:1;width:100%;max-width:380px;margin:1rem;
  background:rgba(22,22,42,0.9);border:0.5px solid rgba(167,139,250,0.25);border-radius:16px;
  padding:2rem 1.75rem;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.login-logo{text-align:center;margin-bottom:1.5rem}
.login-logo-name{font-size:24px;font-weight:700;letter-spacing:-0.02em;
  background:linear-gradient(135deg,#fff 0%,#c4b5fd 50%,#93c5fd 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-logo-sub{font-size:12px;color:rgba(255,255,255,0.45);margin-top:4px}
.login-chips{display:flex;justify-content:center;gap:6px;margin:10px 0 0}
.lchip{font-size:10px;padding:3px 9px;border-radius:20px;border:0.5px solid;font-weight:500}
.lchip-ai{background:rgba(124,58,237,0.2);border-color:rgba(167,139,250,0.35);color:#c4b5fd}
.lchip-bits{background:rgba(37,99,235,0.2);border-color:rgba(96,165,250,0.35);color:#93c5fd}
.login-divider{border:none;border-top:0.5px solid rgba(255,255,255,0.08);margin:1.25rem 0}
.login-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;display:block}
.login-input{width:100%;font-size:14px;padding:10px 14px;border:0.5px solid rgba(255,255,255,0.15);
  border-radius:var(--r-md);background:rgba(255,255,255,0.05);color:var(--text);
  font-family:inherit;outline:none;margin-bottom:12px;-webkit-appearance:none}
.login-input:focus{border-color:rgba(167,139,250,0.6);background:rgba(255,255,255,0.08)}
.login-btn{width:100%;font-size:14px;font-weight:600;padding:11px;border:none;border-radius:var(--r-md);
  background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;cursor:pointer;font-family:inherit;
  margin-top:4px;transition:opacity 0.2s}
.login-btn:hover{opacity:0.88}
.login-err{font-size:12px;color:#fca5a5;margin-top:6px;text-align:center;min-height:18px}
.login-footer{font-size:11px;color:var(--text3);text-align:center;margin-top:14px}

/* ── APP (hidden until logged in) ── */
#app{display:none}

/* ── HEADER BAR ── */
.header-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 1.25rem;
  background:rgba(22,22,42,0.96);border-bottom:0.5px solid var(--border);
  position:sticky;top:0;z-index:101;backdrop-filter:blur(12px)}
.header-user{font-size:13px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:6px}
.logout-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--border2);
  background:transparent;color:var(--text3);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px}
.logout-btn:hover{color:#fca5a5;border-color:rgba(239,68,68,0.4)}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,#1a0533 0%,#0d1b4a 40%,#0a2e1a 100%);padding:1.75rem 1.25rem 1rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,0.25) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(37,99,235,0.2) 0%,transparent 50%),radial-gradient(ellipse at 60% 90%,rgba(5,150,105,0.15) 0%,transparent 50%)}
.hero-inner{max-width:900px;margin:0 auto;position:relative}
.hero-tag{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(167,139,250,0.8);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.hero-tag::before{content:'';width:20px;height:1.5px;background:rgba(167,139,250,0.6);border-radius:2px}
.hero-name{font-size:clamp(20px,5vw,32px);font-weight:700;letter-spacing:-0.02em;line-height:1.15;background:linear-gradient(135deg,#fff 0%,#c4b5fd 50%,#93c5fd 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:14px;color:rgba(255,255,255,0.5);margin-top:4px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:11px;padding:3px 11px;border-radius:20px;border:0.5px solid;font-weight:500}
.chip-ai{background:rgba(124,58,237,0.2);border-color:rgba(167,139,250,0.4);color:#c4b5fd}
.chip-ml{background:rgba(5,150,105,0.2);border-color:rgba(52,211,153,0.4);color:#6ee7b7}
.chip-bits{background:rgba(37,99,235,0.2);border-color:rgba(96,165,250,0.4);color:#93c5fd}
.hero-date{font-size:12px;color:var(--text3);margin-top:12px}

/* ── COURSE NAV ── */
.course-nav-wrap{background:rgba(22,22,42,0.96);border-bottom:0.5px solid var(--border);position:sticky;top:45px;z-index:100;backdrop-filter:blur(12px)}
.course-nav{display:flex;max-width:900px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.course-nav::-webkit-scrollbar{display:none}
.cnav-btn{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:12px 16px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.cnav-btn:hover{color:var(--text)}
.cnav-btn.active-aci{color:var(--aci-h);border-bottom-color:var(--aci-h)}
.cnav-btn.active-drl{color:var(--drl-h);border-bottom-color:var(--drl-h)}
.cnav-btn.active-nlp{color:var(--nlp-h);border-bottom-color:var(--nlp-h)}
.cnav-btn.active-seml{color:var(--seml-h);border-bottom-color:var(--seml-h)}
.cnav-btn.active-todo{color:var(--todo-h);border-bottom-color:var(--todo-h)}
.cnav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-aci{background:var(--aci-h)}.dot-drl{background:var(--drl-h)}.dot-nlp{background:var(--nlp-h)}.dot-seml{background:var(--seml-h)}.dot-todo{background:var(--todo-h)}

/* ── MAIN ── */
.main{max-width:900px;margin:0 auto;padding:1.5rem 1rem 4rem}
.course-panel{display:none}.course-panel.active{display:block}

/* ── CARD HEADER ── */
.ccard-header{border-radius:var(--r-lg) var(--r-lg) 0 0;padding:1.1rem 1.25rem 0.9rem;border:0.5px solid;border-bottom:none;position:relative;overflow:hidden}
.ccard-header-inner{position:relative;z-index:1}
.ccard-title{font-size:16px;font-weight:600;line-height:1.3}
.ccard-meta{font-size:12px;margin-top:5px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ccard-meta span{display:flex;align-items:center;gap:4px}
.ccard-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.04em}
.ch-aci{background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(124,58,237,0.05));border-color:var(--aci-br)}
.ch-aci .ccard-title{color:#e9d5ff}.ch-aci .ccard-meta{color:#c4b5fd}.ch-aci .ccard-badge{background:var(--aci-bg);color:var(--aci-h);border:0.5px solid var(--aci-br)}
.ch-drl{background:linear-gradient(135deg,rgba(5,150,105,0.25),rgba(5,150,105,0.05));border-color:var(--drl-br)}
.ch-drl .ccard-title{color:#a7f3d0}.ch-drl .ccard-meta{color:#6ee7b7}.ch-drl .ccard-badge{background:var(--drl-bg);color:var(--drl-h);border:0.5px solid var(--drl-br)}
.ch-nlp{background:linear-gradient(135deg,rgba(37,99,235,0.25),rgba(37,99,235,0.05));border-color:var(--nlp-br)}
.ch-nlp .ccard-title{color:#bfdbfe}.ch-nlp .ccard-meta{color:#93c5fd}.ch-nlp .ccard-badge{background:var(--nlp-bg);color:var(--nlp-h);border:0.5px solid var(--nlp-br)}
.ch-seml{background:linear-gradient(135deg,rgba(217,119,6,0.25),rgba(217,119,6,0.05));border-color:var(--seml-br)}
.ch-seml .ccard-title{color:#fde68a}.ch-seml .ccard-meta{color:#fcd34d}.ch-seml .ccard-badge{background:var(--seml-bg);color:var(--seml-h);border:0.5px solid var(--seml-br)}
.ch-todo{background:linear-gradient(135deg,rgba(236,72,153,0.25),rgba(236,72,153,0.05));border-color:var(--todo-br)}
.ch-todo .ccard-title{color:#fbcfe8}.ch-todo .ccard-meta{color:#f9a8d4}.ch-todo .ccard-badge{background:var(--todo-bg);color:var(--todo-h);border:0.5px solid var(--todo-br)}

/* ── TEACHERS ── */
.teachers-section{background:var(--surface);border-left:0.5px solid var(--border);border-right:0.5px solid var(--border);padding:0.875rem 1.25rem;border-bottom:0.5px solid var(--border)}
.teachers-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.teachers-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.teacher-row{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;background:var(--surface2);border-radius:var(--r-md);border:0.5px solid var(--border);margin-bottom:6px}
.teacher-info{flex:1;min-width:0}
.teacher-name{font-size:13px;font-weight:500;color:var(--text)}
.teacher-comment{font-size:12px;color:var(--text2);margin-top:2px;font-style:italic}
.teacher-edit-form{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface3);border-radius:var(--r-md);border:0.5px solid var(--border2);margin-bottom:6px}
.teacher-edit-form input,.teacher-edit-form textarea{font-size:13px;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--r-sm);background:var(--surface2);color:var(--text);font-family:inherit;outline:none;width:100%;-webkit-appearance:none}
.teacher-edit-form input:focus,.teacher-edit-form textarea:focus{border-color:rgba(167,139,250,0.5)}
.teacher-edit-form textarea{resize:vertical;min-height:56px;line-height:1.4}
.sm-btn{font-size:12px;padding:5px 12px;border-radius:var(--r-sm);border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.sm-btn:hover{background:var(--surface2)}
.sm-btn-primary{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;font-weight:600}
.sm-btn-primary:hover{opacity:0.88}
.sm-btn-danger{color:#fca5a5}.sm-btn-danger:hover{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.4)}

/* ── INNER TABS ── */
.inner-tabs-wrap{background:var(--surface);border-left:0.5px solid var(--border);border-right:0.5px solid var(--border)}
.inner-tabs{display:flex;border-bottom:0.5px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.inner-tabs::-webkit-scrollbar{display:none}
.itab-btn{flex-shrink:0;padding:9px 14px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap;display:flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent}
.itab-btn:hover{color:var(--text2)}
.aci-itab.active{color:var(--aci-h);border-bottom-color:var(--aci-h)}
.drl-itab.active{color:var(--drl-h);border-bottom-color:var(--drl-h)}
.nlp-itab.active{color:var(--nlp-h);border-bottom-color:var(--nlp-h)}
.seml-itab.active{color:var(--seml-h);border-bottom-color:var(--seml-h)}
.todo-itab.active{color:var(--todo-h);border-bottom-color:var(--todo-h)}

/* ── PANES ── */
.tab-pane{display:none;padding:1rem 1.25rem;flex-direction:column;gap:8px;background:var(--surface);border-left:0.5px solid var(--border);border-right:0.5px solid var(--border)}
.tab-pane.active{display:flex}
.card-footer{height:1rem;background:var(--surface);border:0.5px solid var(--border);border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);margin-bottom:1.25rem}

/* ── TODO ITEMS ── */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--surface2);transition:opacity 0.2s}
.todo-item.done{background:rgba(16,185,129,0.05);border-color:rgba(16,185,129,0.2)}
.todo-item.urgent{border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.07)}
.todo-item.upcoming{border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.06)}
.todo-check{width:16px;height:16px;flex-shrink:0;margin-top:2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.todo-text{font-size:13px;flex:1;line-height:1.45;color:var(--text)}
.todo-text.strike{text-decoration:line-through;color:var(--text3)}
.todo-date{font-size:11px;color:var(--text3);margin-top:2px}
.done-label{font-size:11px;color:#10b981;font-weight:500;white-space:nowrap;padding:2px 7px;border-radius:20px;background:rgba(16,185,129,0.1);border:0.5px solid rgba(16,185,129,0.3)}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;border:0.5px solid}
.pill-urgent{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.4);color:#fca5a5}
.pill-soon{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.4);color:#fcd34d}
.show-more-btn{font-size:12px;background:none;border:none;cursor:pointer;padding:2px 0;text-align:left;font-family:inherit;opacity:0.7}
.show-more-btn:hover{opacity:1;text-decoration:underline}

/* ── PROGRESS ── */
.prog-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3)}
.prog-wrap{flex:1;height:5px;background:var(--surface3);border-radius:4px;overflow:hidden}
.prog-bar{height:100%;border-radius:4px;transition:width 0.4s}

/* ── ADD ROW ── */
.add-row{display:flex;gap:8px;margin-top:4px}
.add-row input{flex:1;font-size:13px;padding:8px 12px;border:0.5px solid var(--border2);border-radius:var(--r-md);background:var(--surface3);color:var(--text);font-family:inherit;outline:none;min-width:0;-webkit-appearance:none}
.add-row input:focus{border-color:rgba(167,139,250,0.5)}
.add-btn{font-size:13px;padding:8px 14px;border:0.5px solid var(--border2);border-radius:var(--r-md);background:rgba(124,58,237,0.15);color:#c4b5fd;cursor:pointer;white-space:nowrap;font-family:inherit;display:flex;align-items:center;gap:4px;font-weight:500;-webkit-tap-highlight-color:transparent}
.add-btn:hover{background:rgba(124,58,237,0.25)}

/* ── DATA CARDS ── */
.data-card{border:0.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface2)}
.data-card-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--surface3);border-bottom:0.5px solid var(--border);gap:8px}
.data-card-name{font-size:13px;font-weight:500;color:var(--text)}
.data-card-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.data-dates{font-size:12px;color:var(--text2);display:flex;gap:14px;flex-wrap:wrap}
.assign-prog-wrap{flex:1;height:9px;background:var(--surface3);border-radius:20px;overflow:hidden;border:0.5px solid var(--border)}
.assign-prog-bar{height:100%;border-radius:20px;transition:width 0.3s}
.pct-input{width:52px;font-size:12px;padding:3px 6px;border:0.5px solid var(--border2);border-radius:var(--r-sm);background:var(--surface3);color:var(--text);font-family:inherit;outline:none;text-align:center;-webkit-appearance:none}
.pct-input:focus{border-color:rgba(167,139,250,0.5)}
.del-btn{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:3px 6px;border-radius:var(--r-sm);-webkit-tap-highlight-color:transparent}
.del-btn:hover{color:#fca5a5;background:rgba(239,68,68,0.1)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ebadge,.quiz-status{font-size:11px;padding:2px 8px;border-radius:20px;border:0.5px solid;font-weight:500}
.eb-upcoming,.qs-upcoming{background:rgba(96,165,250,0.1);border-color:rgba(96,165,250,0.4);color:#93c5fd}
.eb-soon,.qs-open{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.4);color:#fca5a5}
.eb-done,.qs-closed{background:rgba(52,211,153,0.1);border-color:rgba(52,211,153,0.4);color:#6ee7b7}
.qs-open{background:rgba(52,211,153,0.1);border-color:rgba(52,211,153,0.4);color:#6ee7b7}

/* ── ADD FORM ── */
.add-form{background:var(--surface3);border:0.5px solid var(--border2);border-radius:var(--r-md);padding:12px;display:none;flex-direction:column;gap:10px;margin-top:4px}
.add-form-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em}
.form-grid{display:flex;flex-wrap:wrap;gap:8px}
.form-grid input,.form-grid select{font-size:13px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--r-sm);background:var(--surface2);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none;min-width:0}
.form-grid input.form-full,.form-grid select.form-full{width:100%}
.form-grid input:not(.form-full){flex:1;min-width:130px}
.form-grid input:focus,.form-grid select:focus{border-color:rgba(167,139,250,0.5);background:var(--surface)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn-primary{font-size:12px;padding:7px 18px;border-radius:var(--r-md);border:none;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;-webkit-tap-highlight-color:transparent}
.btn-primary:hover{opacity:0.88}
.btn-cancel{font-size:12px;padding:7px 14px;border-radius:var(--r-md);border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:var(--surface2)}
.toggle-form-btn{font-size:12px;padding:7px 14px;border-radius:var(--r-md);border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;align-self:flex-start;-webkit-tap-highlight-color:transparent}
.toggle-form-btn:hover{border-color:rgba(167,139,250,0.5);color:var(--aci-h)}
.empty-state{font-size:13px;color:var(--text3);text-align:center;padding:16px 0}

function doLogin(){
  var u = (document.getElementById('li-user').value||'').trim().toLowerCase();
  var p = (document.getElementById('li-pass').value||'').trim();
  var match = USERS.filter(function(x){ return x.username===u && x.password===p; })[0];

    sessionStorage.setItem('sess_user', match.displayName);
    document.getElementById('login-page').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('hdr-username').textContent = match.displayName;
    document.getElementById('login-err').textContent='';

  } else {
    document.getElementById('login-err').textContent='Incorrect username or password.';
    document.getElementById('li-pass').value='';
  }
}
function doLogout(){
  sessionStorage.removeItem('sess_user');

  document.getElementById('li-user').value='';
  document.getElementById('li-pass').value='';
}

// ── STORAGE ──────────────────────────────────────────────────────────────────
var uid=function(){return 'id'+Date.now()+Math.random().toString(36).slice(2,5);};
function load(k,d){try{var v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function init(c){
  ['teachers','classes','webinars','assignments','exams','quizzes','todos'].forEach(function(type){
    var key='v5_'+type+'_'+c.id;
    if(load(key,null)===null){
      var cap=type.charAt(0).toUpperCase()+type.slice(1);
      save(key, c['default'+cap]||[]);
    }
  });
}
COURSES.forEach(init);
// global todos
if(load('v5_gtodos',null)===null) save('v5_gtodos',[]);

var activeCourse='aci';
var activePaneTab={aci:'classes',drl:'classes',nlp:'classes',seml:'classes'};
var editingTeacher={};

function pctColor(p){return p>=100?'#10b981':p>50?'#818cf8':p>0?'#f59e0b':'#6b7280';}
function fmtDate(d){if(!d)return '—';try{return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}}
function fmtDT(d,t){if(!d)return '—';try{return new Date(d+'T'+(t||'00:00')).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+(t||'00:00');}catch(e){return d;}}
function examStatus(d,t){if(!d)return 'upcoming';var diff=(new Date(d+'T'+(t||'00:00'))-new Date())/864e5;return diff<0?'done':diff<3?'soon':'upcoming';}
function quizStatus(s,e){var now=new Date();if(!s)return 'upcoming';var sd=new Date(s+'T00:00:00');var ed=new Date(e+'T23:59:59');if(now<sd)return 'upcoming';if(now<=ed)return 'open';return 'closed';}
var accentVar={aci:'var(--aci-h)',drl:'var(--drl-h)',nlp:'var(--nlp-h)',seml:'var(--seml-h)',todo:'var(--todo-h)'};
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  var el=document.getElementById('panels');
  if(!el) return;
  el.innerHTML=COURSES.map(renderPanel).join('')+renderGlobalTodo();
  var dd=document.getElementById('date-display');
  if(dd) dd.textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  ['aci','drl','nlp','seml','todo'].forEach(function(id){
    var nb=document.getElementById('nav-'+id);
    if(nb) nb.className='cnav-btn'+(id===activeCourse?' active-'+id:'');
  });
}

function renderPanel(c){
  var atab=activePaneTab[c.id]||'classes';
  var teachers=load('v5_teachers_'+c.id,[]);
  var tabs=[
    {id:'classes',label:'Classes',icon:'ti-school'},
    {id:'webinar',label:'Webinar',icon:'ti-video'},
    {id:'todos',label:'To Do',icon:'ti-checklist'},
    {id:'assign',label:'Assignments',icon:'ti-file-description'},
    {id:'quizzes',label:'Quizzes',icon:'ti-help-circle'},
    {id:'exam',label:'Exams',icon:'ti-calendar-event'}
  ];
  var innerTabs='<div class="inner-tabs-wrap"><div class="inner-tabs">'+
    tabs.map(function(t){
      return '<button class="itab-btn '+c.itabcls+' '+(atab===t.id?'active':'')+'" onclick="switchPane(\''+c.id+'\',\''+t.id+'\')"><i class="ti '+t.icon+'" style="font-size:12px" aria-hidden="true"></i>'+t.label+'</button>';
    }).join('')+'</div></div>';

  var header='<div class="ccard-header '+c.hcls+'"><div class="ccard-header-inner">'+
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">'+
    '<div class="ccard-title">'+c.title+'</div><span class="ccard-badge">'+c.badgeText+'</span></div>'+
    '<div class="ccard-meta"><span><i class="ti ti-clock" style="font-size:12px"></i>'+c.schedule+'</span>'+
    '<span><i class="ti ti-users" style="font-size:12px"></i>'+c.group+'</span></div>'+
    '</div></div>';

  return '<div class="course-panel '+(c.id===activeCourse?'active':'')+'" id="panel-'+c.id+'">'+
    header+
    renderTeachers(c,teachers)+
    innerTabs+
    renderListPane(c,'classes',load('v5_classes_'+c.id,[]),atab)+
    renderListPane(c,'webinar',load('v5_webinars_'+c.id,[]),atab)+
    renderTodosPane(c,load('v5_todos_'+c.id,[]),atab)+
    renderAssignPane(c,load('v5_assignments_'+c.id,[]),atab)+
    renderQuizPane(c,load('v5_quizzes_'+c.id,[]),atab)+
    renderExamPane(c,load('v5_exams_'+c.id,[]),atab)+
    '<div class="card-footer"></div></div>';
}

// ── TEACHERS ─────────────────────────────────────────────────────────────────
function renderTeachers(c,teachers){
  var editing=editingTeacher[c.id];
  var rows=teachers.map(function(t){
    if(editing===t.id){
      return '<div class="teacher-edit-form">'+
        '<input id="ten_'+c.id+'_'+t.id+'" value="'+escHtml(t.name)+'" placeholder="Teacher name">'+
        '<textarea id="tec_'+c.id+'_'+t.id+'" placeholder="Comment / note">'+escHtml(t.comment||'')+'</textarea>'+
        '<div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">'+
        '<button class="sm-btn sm-btn-danger" onclick="deleteTeacher(\''+c.id+'\',\''+t.id+'\')"><i class="ti ti-trash" style="font-size:12px"></i> Delete</button>'+
        '<button class="sm-btn" onclick="cancelEditTeacher(\''+c.id+'\')">Cancel</button>'+
        '<button class="sm-btn sm-btn-primary" onclick="saveTeacher(\''+c.id+'\',\''+t.id+'\')">Save</button>'+
        '</div></div>';
    }
    return '<div class="teacher-row">'+
      '<div class="teacher-info"><div class="teacher-name"><i class="ti ti-user" style="font-size:12px;vertical-align:-1px;margin-right:5px;opacity:0.6"></i>'+escHtml(t.name)+'</div>'+
      (t.comment?'<div class="teacher-comment">'+escHtml(t.comment)+'</div>':'')+
      '</div><button class="sm-btn" onclick="startEditTeacher(\''+c.id+'\',\''+t.id+'\')"><i class="ti ti-pencil" style="font-size:12px"></i></button></div>';
  }).join('');
  var addForm=editing==='new'?'<div class="teacher-edit-form">'+
    '<input id="ten_'+c.id+'_new" placeholder="Teacher name">'+
    '<textarea id="tec_'+c.id+'_new" placeholder="Comment / note (optional)"></textarea>'+
    '<div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">'+
    '<button class="sm-btn" onclick="cancelEditTeacher(\''+c.id+'\')">Cancel</button>'+
    '<button class="sm-btn sm-btn-primary" onclick="addTeacher(\''+c.id+'\')">Add</button>'+
    '</div></div>':'';
  var addBtn=editing!=='new'?'<button class="sm-btn" onclick="startNewTeacher(\''+c.id+'\')"><i class="ti ti-plus" style="font-size:12px"></i> Add teacher</button>':'';
  return '<div class="teachers-section">'+
    '<div class="teachers-header"><div class="teachers-label"><i class="ti ti-chalkboard" style="font-size:12px;vertical-align:-1px;margin-right:4px"></i>Instructors</div></div>'+
    (rows||(!editing?'<div style="font-size:13px;color:var(--text3);margin-bottom:8px">No instructors added yet.</div>':''))+
    addForm+addBtn+'</div>';
}
function startEditTeacher(cid,tid){editingTeacher[cid]=tid;render();}
function startNewTeacher(cid){editingTeacher[cid]='new';render();}
function cancelEditTeacher(cid){delete editingTeacher[cid];render();}
function saveTeacher(cid,tid){
  var ne=document.getElementById('ten_'+cid+'_'+tid),ce=document.getElementById('tec_'+cid+'_'+tid);
  if(!ne||!ne.value.trim()) return;
  var ts=load('v5_teachers_'+cid,[]);
  var t=ts.filter(function(x){return x.id===tid;})[0];
  if(t){t.name=ne.value.trim();t.comment=ce?ce.value.trim():'';}
  save('v5_teachers_'+cid,ts);delete editingTeacher[cid];render();
}
function addTeacher(cid){
  var ne=document.getElementById('ten_'+cid+'_new'),ce=document.getElementById('tec_'+cid+'_new');
  if(!ne||!ne.value.trim()) return;
  var ts=load('v5_teachers_'+cid,[]);
  ts.push({id:uid(),name:ne.value.trim(),comment:ce?ce.value.trim():''});
  save('v5_teachers_'+cid,ts);delete editingTeacher[cid];render();
}
function deleteTeacher(cid,tid){
  save('v5_teachers_'+cid,load('v5_teachers_'+cid,[]).filter(function(t){return t.id!==tid;}));
  delete editingTeacher[cid];render();
}

// ── LIST PANE (Classes / Webinar) ─────────────────────────────────────────────
function renderListPane(c,type,items,atab){
  var paneId=type==='classes'?'classes':'webinar';
  var doneKey='v5_done_'+c.id+'_'+type;
  var showKey='v5_showdone_'+c.id+'_'+type;
  var done=load(doneKey,{});
  var showAll=load(showKey,false);
  var MAX=3;
  var accent=accentVar[c.id];
  var pending=items.filter(function(t){return !done[t.id];});
  var doneList=items.filter(function(t){return done[t.id];});
  var shownDone=showAll?doneList:doneList.slice(0,MAX);
  var hidden=doneList.length-shownDone.length;
  var total=items.length,doneCount=doneList.length;
  var pct=total?Math.round(doneCount/total*100):0;
  var placeholder=type==='classes'?'Add class topic…':'Add webinar topic…';

  function item(t){
    var isDone=!!done[t.id];
    var uc=t.urgency==='urgent'?'urgent':t.urgency==='warning'?'upcoming':'';
    return '<div class="todo-item '+(isDone?'done':uc)+'">'+
      '<input type="checkbox" class="todo-check" '+(isDone?'checked':'')+' style="accent-color:'+accent+'" onchange="toggleListItem(\''+c.id+'\',\''+type+'\',\''+t.id+'\',this.checked)" aria-label="'+escHtml(t.text)+'">'+
      '<div style="flex:1"><div class="todo-text '+(isDone?'strike':'')+'" >'+escHtml(t.text)+'</div>'+
      (t.date?'<div class="todo-date">'+escHtml(t.date)+'</div>':'')+
      '</div>'+
      (isDone?'<span class="done-label">✓ Done</span>':'')+(t.urgency&&!isDone?'<span class="pill '+(t.urgency==='urgent'?'pill-urgent':'pill-soon')+'">'+(t.urgency==='urgent'?'Urgent':'Soon')+'</span>':'')+
      '<button class="del-btn" onclick="deleteListItem(\''+c.id+'\',\''+type+'\',\''+t.id+'\')" aria-label="Delete"><i class="ti ti-trash" style="font-size:12px"></i></button>'+
      '</div>';
  }

  var doneSection=doneList.length?
    '<hr class="sec-divider"><div class="sec-label" style="margin:2px 0 4px">Completed ('+doneCount+')</div>'+
    shownDone.map(item).join('')+
    (hidden>0?'<button class="show-more-btn" style="color:'+accent+'" onclick="toggleShowDone(\''+c.id+'\',\''+type+'\',true)">+ Show '+hidden+' more completed</button>':'')+
    (showAll&&doneList.length>MAX?'<button class="show-more-btn" style="color:'+accent+'" onclick="toggleShowDone(\''+c.id+'\',\''+type+'\',false)">Show fewer ↑</button>':''):'';

  return '<div class="tab-pane '+(atab===paneId?'active':'')+'" id="pane_'+c.id+'_'+paneId+'">'+
    '<div class="prog-row"><div class="prog-wrap"><div class="prog-bar" style="width:'+pct+'%;background:'+accent+'"></div></div><span>'+doneCount+'/'+total+' done</span></div>'+
    pending.map(item).join('')+

// ── TODOS PANE (per-subject, with deadline & %) ───────────────────────────────
function renderTodosPane(c,todos,atab){
  var doneKey='v5_tdone_'+c.id;
  var done=load(doneKey,{});
  var showKey='v5_tshow_'+c.id;
  var showAll=load(showKey,false);
  var MAX=3;

  var pending=todos.filter(function(t){return !done[t.id];});
  var doneList=todos.filter(function(t){return done[t.id];});
  var shownDone=showAll?doneList:doneList.slice(0,MAX);
  var hidden=doneList.length-shownDone.length;
  var total=todos.length,doneCount=doneList.length;
  var pct=total?Math.round(doneCount/total*100):0;

  function item(t){
    var isDone=!!done[t.id];
    var p=Math.min(100,Math.max(0,Number(t.pct)||0));
    var uc=t.urgency==='urgent'?'urgent':t.urgency==='warning'?'upcoming':'';
    return '<div class="todo-item '+(isDone?'done':uc)+'" id="tdi_'+t.id+'">'+
      '<input type="checkbox" class="todo-check" '+(isDone?'checked':'')+' style="accent-color:'+accent+'" onchange="toggleSubjTodo(\''+c.id+'\',\''+t.id+'\',this.checked)">'+
      '<div style="flex:1;min-width:0">'+
        '<div class="todo-text '+(isDone?'strike':'')+'" style="margin-bottom:'+(isDone?0:4)+'px">'+escHtml(t.text)+'</div>'+
        (t.deadline&&!isDone?'<div class="todo-date"><i class="ti ti-calendar" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>Deadline: '+fmtDate(t.deadline)+'</div>':'')+
        (!isDone?'<div style="display:flex;align-items:center;gap:6px;margin-top:5px">'+
          '<div class="assign-prog-wrap" style="height:6px"><div class="assign-prog-bar" style="width:'+p+'%;background:'+pctColor(p)+'"></div></div>'+
          '<input type="number" class="pct-input" min="0" max="100" value="'+p+'" onchange="updateSubjTodoPct(\''+c.id+'\',\''+t.id+'\',this.value)" style="width:44px;font-size:11px;padding:2px 4px">'+
          '<span style="font-size:11px;color:var(--text3)">%</span>'+
        '</div>':'')
      +'</div>'+
      (isDone?'<span class="done-label">✓ Done</span>':'')+
      (t.urgency&&!isDone?'<span class="pill '+(t.urgency==='urgent'?'pill-urgent':'pill-soon')+'">'+(t.urgency==='urgent'?'Urgent':'Soon')+'</span>':'')+
      '<button class="del-btn" onclick="deleteSubjTodo(\''+c.id+'\',\''+t.id+'\')" aria-label="Delete"><i class="ti ti-trash" style="font-size:12px"></i></button>'+
      '</div>';
  }

  var doneSection=doneList.length?
    '<hr class="sec-divider"><div class="sec-label" style="margin:2px 0 4px">Completed ('+doneCount+')</div>'+
    shownDone.map(item).join('')+
    (hidden>0?'<button class="show-more-btn" style="color:'+accent+'" onclick="toggleSubjTodoShow(\''+c.id+'\',true)">+ Show '+hidden+' more completed</button>':'')+
    (showAll&&doneList.length>MAX?'<button class="show-more-btn" style="color:'+accent+'" onclick="toggleSubjTodoShow(\''+c.id+'\',false)">Show fewer ↑</button>':''):'';

  return '<div class="tab-pane '+(atab==='todos'?'active':'')+'" id="pane_'+c.id+'_todos">'+
    '<div class="prog-row"><div class="prog-wrap"><div class="prog-bar" style="width:'+pct+'%;background:'+accent+'"></div></div><span>'+doneCount+'/'+total+' done</span></div>'+
    pending.map(item).join('')+
    (!todos.length?'<div class="empty-state">No tasks yet. Add one below.</div>':'')+
    doneSection+
    '<div class="add-form" id="tdform_'+c.id+'">'+
      '<div class="add-form-title">New task</div>'+
      '<div class="form-grid">'+
        '<input class="form-full" type="text" id="tdtext_'+c.id+'" placeholder="Task description">'+
        '<input type="date" id="tddeadline_'+c.id+'" placeholder="Deadline">'+
        '<select id="tdurgency_'+c.id+'">'+
          '<option value="">No urgency</option>'+
          '<option value="warning">Soon</option>'+
          '<option value="urgent">Urgent</option>'+
        '</select>'+
      '</div>'+
      '<div class="form-actions">'+
        '<button class="btn-cancel" onclick="hideForm(\''+c.id+'\',\'tdform\')">Cancel</button>'+
        '<button class="btn-primary" onclick="addSubjTodo(\''+c.id+'\')">Add task</button>'+
      '</div>'+
    '</div>'+
    '<button class="toggle-form-btn" id="tdbtn_'+c.id+'" onclick="showForm(\''+c.id+'\',\'tdform\')"><i class="ti ti-plus" style="font-size:13px"></i> Add task</button>'+
    '</div>';
}

    '<div class="form-grid"><input class="form-full" type="text" id="edesc_'+c.id+'" placeholder="Exam or quiz name">'+
    '<input type="date" id="edate_'+c.id+'"><input type="time" id="etime_'+c.id+'">'+
    '<input class="form-full" type="text" id="enote_'+c.id+'" placeholder="Additional note (optional)"></div>'+
    '<div class="form-actions"><button class="btn-cancel" onclick="hideForm(\''+c.id+'\',\'eform\')">Cancel</button>'+
    '<button class="btn-primary" onclick="addExam(\''+c.id+'\')">Add</button></div></div>'+
    '<button class="toggle-form-btn" id="ebtn_'+c.id+'" onclick="showForm(\''+c.id+'\',\'eform\')">'+
    '<i class="ti ti-plus" style="font-size:13px"></i> Add exam / quiz</button></div>';
}
function addExam(cid){
  var desc=document.getElementById('edesc_'+cid);if(!desc||!desc.value.trim())return;
  var exams=load('v5_exams_'+cid,[]);
  exams.push({id:uid(),desc:desc.value.trim(),
    date:document.getElementById('edate_'+cid)?document.getElementById('edate_'+cid).value:'',
    time:document.getElementById('etime_'+cid)?document.getElementById('etime_'+cid).value:'',
    note:document.getElementById('enote_'+cid)?document.getElementById('enote_'+cid).value.trim():''});
  save('v5_exams_'+cid,exams);activePaneTab[cid]='exam';render();
}
function deleteExam(cid,eid){
  save('v5_exams_'+cid,load('v5_exams_'+cid,[]).filter(function(e){return e.id!==eid;}));
  activePaneTab[cid]='exam';render();
}

// ── FORM HELPERS ──────────────────────────────────────────────────────────────
function showForm(cid,prefix){
  var f=document.getElementById(prefix+'_'+cid);
  var b=document.getElementById(prefix.replace('form','btn')+'_'+cid);
  if(f){f.style.display='flex';f.style.flexDirection='column';}
  if(b) b.style.display='none';
}
function hideForm(cid,prefix){
  var f=document.getElementById(prefix+'_'+cid);
  var b=document.getElementById(prefix.replace('form','btn')+'_'+cid);
  if(f) f.style.display='none';
  if(b) b.style.display='flex';
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function switchCourse(id){activeCourse=id;render();window.scrollTo({top:0,behavior:'smooth'});}
function switchPane(cid,tab){activePaneTab[cid]=tab;render();}

// Initial render
render();
</script>
</body>
</html>
